name: Bug report / Reportar un error
description: Report a reproducible problem using non-private sample data.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: 'Do not include private EPUBs, notes, keys or database dumps. For security issues, read SECURITY.md.'
  - type: textarea
    id: problem
    attributes:
      label: What happened? / ¿Qué pasó?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce / Pasos
      description: Prefer the original EPUB generated by npm run demo:epub.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser, OS and commit/version
      placeholder: Chrome, Windows, commit abc123; Scroll layout
    validations:
      required: true
